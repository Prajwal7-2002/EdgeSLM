name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # pyproject.toml points Linux at the CPU PyTorch wheels; the tests never
      # touch a GPU or download model weights.
      - run: uv sync --locked
      - run: uv run pytest -q
