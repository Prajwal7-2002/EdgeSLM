[project]
name = "edgeslm"
version = "0.3.0"
description = "Document-sensitivity classifier (LoRA on a small open LM) that runs on a laptop CPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
    "datasets==5.0.1",
    "trl==1.10.0",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    # Reading real files: PDF and Word
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    # The TF-IDF baseline
    "scikit-learn==1.9.0",
    # Edge: ONNX export, quantisation, memory measurement
    "optimum==2.1.0",
    "optimum-onnx==0.1.0",
    "onnx==1.22.0",
    "onnx-ir==1.0.0",
    "onnxruntime==1.29.0",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.uv]
# Scripts run from src/ directly; there is nothing to build or install.
package = false

# CUDA wheels on Windows (training and GPU inference), CPU wheels on Linux so
# CI does not download 2 GB of CUDA libraries. macOS uses PyPI's default build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
